name: Verify Proposal Build
run-name: "Verify Proposal #${{ inputs.proposal_id }}"

on:
  workflow_dispatch:
    inputs:
      proposal_id:
        description: 'NNS Proposal ID to verify'
        required: true
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dfinity/ic-build:latest
      options: --privileged -v /var/run/docker.sock:/var/run/docker.sock
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Setup build environment
        run: |
          # Disable BuildKit to avoid buildx requirement
          echo "DOCKER_BUILDKIT=0" >> $GITHUB_ENV

      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          # Remove unnecessary files to maximize available space
          rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          rm -rf /usr/local/share/boost /usr/share/swift || true
          rm -rf /var/lib/apt/lists/* /tmp/* || true
          docker system prune -af --volumes || true
          # Clean podman storage if exists
          podman system prune -af 2>/dev/null || true
          echo "Disk space after cleanup:"
          df -h

      - name: Fetch proposal from NNS
        id: fetch
        run: npx tsx src/fetch-proposal.ts ${{ inputs.proposal_id }}

      - name: Notify portal (verification started → db)
        if: ${{ steps.fetch.outputs.skipped != 'true' }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PORTAL_URL: https://proposal-reviewer-portal.vercel.app
        run: |
          [ -z "$CRON_SECRET" ] && { echo "no CRON_SECRET; skip"; exit 0; }
          curl -fsS -X POST "$PORTAL_URL/api/verification-event" \
            -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" \
            -d "{\"proposalId\":\"${{ inputs.proposal_id }}\",\"type\":\"started\",\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            && echo " started notified" || echo " notify failed (non-fatal)"

      - name: Extract build steps via LLM
        if: steps.fetch.outputs.skipped != 'true'
        run: |
          # Extra masking for the API key
          echo "::add-mask::$GEMINI_API_KEY"
          npx tsx src/extract-build-steps.ts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Build WASM
        if: steps.fetch.outputs.skipped != 'true'
        run: bash scripts/build.sh
        env:
          DOCKER_BUILDKIT: 0
          # Tell build-ic.sh we're already in the correct container (ic-build)
          # This skips nested container creation which fails on cgroups and disk space
          DFINITY_CONTAINER: "true"
          # Cloudflare R2-backed Bazel remote cache
          BAZEL_REMOTE_CACHE_URL: ${{ secrets.BAZEL_REMOTE_CACHE_URL }}
          BAZEL_REMOTE_CACHE_TOKEN: ${{ secrets.BAZEL_REMOTE_CACHE_TOKEN }}

      - name: Install didc (for arg hash verification)
        if: steps.fetch.outputs.skipped != 'true'
        run: |
          # Download and install didc for candid encoding
          DIDC_VERSION="2025-12-18"
          curl -fsSL "https://github.com/dfinity/candid/releases/download/${DIDC_VERSION}/didc-linux64" -o /usr/local/bin/didc
          chmod +x /usr/local/bin/didc
          didc --version

      - name: Compare hashes
        if: steps.fetch.outputs.skipped != 'true'
        run: npx tsx src/compare-hash.ts

      - name: Upload verification result (machine-readable)
        # Always attempt upload (even on a failed comparison) so the auditor can read the result.
        if: ${{ always() && steps.fetch.outputs.skipped != 'true' && hashFiles('verification-result.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: verification-result
          path: verification-result.json
          retention-days: 90

      - name: Notify portal (verification green → event-driven review)
        # Only on a successful (green) verification. Lets the portal post the verification
        # note within seconds instead of waiting for its polling reconciler. Non-fatal.
        if: ${{ success() && steps.fetch.outputs.skipped != 'true' }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PORTAL_URL: https://proposal-reviewer-portal.vercel.app
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set; skipping callback"; exit 0; fi
          curl -fsS -X POST "$PORTAL_URL/api/review-verified-proposal" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"proposalId\":\"${{ inputs.proposal_id }}\"}" \
            && echo "portal notified" || echo "portal callback failed (non-fatal; reconciler will catch it)"
